<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CA INDEPENDIENTE SUBASTAS</title>
<style>
body {font-family: Arial, sans-serif; background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url(fotos/Compras.PNG); background-size: cover; background-position: left; background-attachment: fixed; min-height: 100vh; background-repeat: no-repeat;}
h1 {font-size: 38px; color: rgb(200,4,10);text-align: center; padding-top: 60px;}

.barra-superior { background-color: rgb(200,4,10); position: fixed; top: 0; left: 0; width: 100%; height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 1000;}
.barra-superior nav {display: flex; gap: 30px;}
.barra-superior a { color: white; text-decoration: none; font-family: Arial, sans-serif; font-size: 18px; padding: 10px 15px; border-radius: 5px;}
.barra-superior a:hover{background-color: #222}

.escudos {display: flex;align-items: center;gap: 10px;}
.escudos img {width: 50px; height: 50px; object-fit: contain;}

/* --- MENÚ FLOTANTE Y NOTIFICACIÓN --- */
.menu-flotante {position: fixed; bottom: 25px; right: 25px; display: flex; flex-direction: column-reverse; align-items: center; z-index: 2000;}
.boton-principal {position: relative; width: 60px; height: 60px; border: none; border-radius: 50%; background-color: #c8102e; color: white; font-size: 25px; cursor: pointer; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);}
.botones-secundarios {display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; opacity: 0; transform: translateY(20px); pointer-events: none; transition: 0.3s ease;}
.botones-secundarios a, .botones-secundarios .carrito-preview {width: 160px; padding: 12px; background-color: #222; color: white; text-decoration: none; text-align: center; border-radius: 8px; font-family: Arial, sans-serif; box-sizing: border-box;}
.menu-flotante:hover .botones-secundarios {opacity: 1; transform: translateY(0); pointer-events: auto;}

/* Globo indicador de cantidad de artículos */
.contador-carrito { position: absolute; top: -5px; right: -5px; background-color: white; color: #c8102e; border: 2px solid #c8102e; font-size: 14px; font-weight: bold; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

/* Vista rápida de productos dentro del menú */
.carrito-preview { font-size: 13px; border-top: 2px solid #c8102e; background-color: #111 !important; text-align: left !important; max-height: 150px; overflow-y: auto;}
.item-carrito { margin-bottom: 5px; border-bottom: 1px dashed #444; padding-bottom: 5px; }

/* --- SECCIÓN DE PRODUCTOS EN GRIDEADO FLEX --- */
.contenedor-imagenes {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 25px;
    flex-wrap: wrap;
    margin-top: 40px;
    padding: 20px;
}
.tarjeta-producto {
    background-color: rgba(255, 255, 255, 0.95);
    border-radius: 12px;
    padding: 15px;
    width: 250px;
    text-align: center;
    box-shadow: 0 6px 15px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.3s ease;
}
.tarjeta-producto:hover { transform: scale(1.03); }
.tarjeta-producto img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 8px;
}
.tarjeta-producto h3 { font-size: 16px; color: #222; margin: 12px 0 6px 0; font-family: Arial, sans-serif; }
.tarjeta-producto .precio { font-size: 18px; font-weight: bold; color: rgb(200,4,10); margin-bottom: 12px; }

/* Botón Agregar */
.btn-agregar {
    background-color: rgb(200,4,10);
    color: white;
    border: none;
    padding: 10px 15px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.2s;
    width: 100%;
}
.btn-agregar:hover { background-color: #222; }
</style>
</head>
<body>

<div class="menu-flotante">
    <button class="boton-principal">
        ☰
        <span class="contador-carrito" id="num-articulos">0</span>
    </button>
    <div class="botones-secundarios">
        <div class="carrito-preview" id="lista-vista-rapida">
            <i>Carrito vacío</i>
        </div>
        <a href="Carrito.html" style="font-weight: bold; background-color: #c8102e;">Ver Carrito Completo</a>
        <a href="titulos.html">Seguidos / Favoritos</a>
        <a href="historia.html">Articulos publicados</a>
        <a href="Compras.html">Compra / ofertas</a>
    </div>
</div>

<header class="barra-superior">
    <div class="escudos">
        <img src="fotos/escudo1.PNG">
        <img src="fotos/escudo2.PNG">
        <img src="fotos/captura.PNG">
    </div>
    <nav>
        <a href="prueba1.HTML">Inicio</a>
        <a href="servicios.html">Servicios</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="Perfil.html">Perfil</a>
    </nav>
</header>

<h1>Club Atlético Independiente<br>TIENDA</h1>

<!-- --- SECCIÓN DE PRODUCTOS --- -->
<div class="contenedor-imagenes">
    
    <!-- Producto 1 -->
    <div class="tarjeta-producto">
        <img src="fotos/CAMPERA.jpg" alt="Campera de Entrenamiento">
        <h3>Campera de Entrenamiento CAI</h3>
        <div class="precio">\$149.999</div>
        <button class="btn-agregar" onclick="agregarAlCarrito('Campera Entrenamiento', 149999)">Agregar al carrito</button>
    </div>

    <!-- Producto 2 (Corregida la comilla de apertura que faltaba en src) -->	
    <div class="tarjeta-producto">
        <img src="fotos/CAMPERA2.jpg" alt="Campera Prematch King">
        <h3>Campera Prematch King Anthem</h3>
        <div class="precio">\$179.999</div>
        <button class="btn-agregar" onclick="agregarAlCarrito('Campera King Anthem', 179999)">Agregar al carrito</button>
    </div>

    <!-- Producto 3 -->
    <div class="tarjeta-producto">
        <img src="fotos/CAMPERA3.jpg" alt="Campera Urbana Trinchera">
        <h3>Campera Tech Bomber Oficial</h3>
        <div class="precio">\$165.000</div>
        <button class="btn-agregar" onclick="agregarAlCarrito('Campera Tech Bomber', 165000)">Agregar al carrito</button>
    </div>

</div>

<!-- --- LÓGICA DEL CARRITO --- -->
<script>
let carrito = [];

function agregarAlCarrito(nombre, precio) {
    carrito.push({ nombre: nombre, precio: precio });
    actualizarInterfazCarrito();
}

function actualizarInterfazCarrito() {
    const contador = document.getElementById('num-articulos');
    const vistaRapida = document.getElementById('lista-vista-rapida');
    
    contador.textContent = carrito.length;
    
    if (carrito.length === 0) {
        vistaRapida.innerHTML = '<i>Carrito vacío</i>';
        return;
    }
    
    vistaRapida.innerHTML = '';
    let totalAcumulado = 0;
    
    carrito.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'item-carrito';
        div.innerHTML = `<strong>${item.nombre}</strong><br>$${item.precio.toLocaleString('es-AR')}`;
        vistaRapida.appendChild(div);
        totalAcumulado += item.precio; 
    });
    
    const divTotal = document.createElement('div');
    divTotal.style.marginTop = '10px';
    divTotal.style.color = '#fff';
    divTotal.innerHTML = `<strong>Total: $${totalAcumulado.toLocaleString('es-AR')}</strong>`;
    vistaRapida.appendChild(divTotal);
}
</script>

</body>
</html>
