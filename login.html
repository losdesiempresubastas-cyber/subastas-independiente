<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CA INDEPENDIENTE SUBASTAS - Ingresar</title>
<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f2f2f2;
}

.caja {
  background-color: white;
  width: 350px;
  margin: 100px auto;
  padding: 30px;
  border-radius: 8px;
}

.caja h1 {
  color: rgb(200,4,10);
  font-size: 22px;
  text-align: center;
}

.caja input {
  width: 100%;
  padding: 8px;
  margin-top: 10px;
}

.caja button {
  width: 100%;
  padding: 8px;
  margin-top: 10px;
  background-color: rgb(200,4,10);
  color: white;
  border: none;
}

#mensaje {
  text-align: center;
  margin-top: 10px;
  color: rgb(200,4,10);
}
</style>
</head>
<body>

<div class="caja">
  <h1>Independiente Subastas</h1>

  <button onclick="cambiarFormulario('login')">Iniciar sesión</button>
  <button onclick="cambiarFormulario('registro')">Crear cuenta</button>

  <form id="formLogin" onsubmit="return iniciarSesion()">
    <input type="text" id="loginMail" placeholder="Mail">
    <input type="password" id="loginClave" placeholder="Clave">
    <button type="submit">Entrar</button>
  </form>

  <form id="formRegistro" style="display:none" onsubmit="return crearCuenta()">
    <input type="text" id="regNombre" placeholder="Nombre">
    <input type="text" id="regApellido" placeholder="Apellido">
    <input type="text" id="regEdad" placeholder="Edad">
    <input type="text" id="regMail" placeholder="Mail">
    <input type="password" id="regClave" placeholder="Clave">
    <input type="password" id="regClave2" placeholder="Confirmar clave">
    <button type="submit">Registrarme</button>
  </form>

  <p id="mensaje"></p>
</div>

<script>

function cambiarFormulario(cual) {
  if (cual == 'login') {
    document.getElementById('formLogin').style.display = 'block';
    document.getElementById('formRegistro').style.display = 'none';
  } else {
    document.getElementById('formLogin').style.display = 'none';
    document.getElementById('formRegistro').style.display = 'block';
  }
  document.getElementById('mensaje').innerHTML = '';
}

// devuelve true si el texto tiene algun numero
function tieneNumeros(texto) {
  for (var i = 0; i < texto.length; i++) {
    if (texto[i] >= '0' && texto[i] <= '9') {
      return true;
    }
  }
  return false;
}

// devuelve true si el texto es todo numeros
function esSoloNumeros(texto) {
  for (var i = 0; i < texto.length; i++) {
    if (texto[i] < '0' || texto[i] > '9') {
      return false;
    }
  }
  return true;
}

function crearCuenta() {
  var nombre = document.getElementById('regNombre').value;
  var apellido = document.getElementById('regApellido').value;
  var edad = document.getElementById('regEdad').value;
  var mail = document.getElementById('regMail').value;
  var clave = document.getElementById('regClave').value;
  var clave2 = document.getElementById('regClave2').value;

  if (tieneNumeros(nombre)) {
    document.getElementById('mensaje').innerHTML = 'El nombre no puede tener numeros';
    return false;
  }

  if (tieneNumeros(apellido)) {
    document.getElementById('mensaje').innerHTML = 'El apellido no puede tener numeros';
    return false;
  }

  if (esSoloNumeros(edad) == false || edad == '') {
    document.getElementById('mensaje').innerHTML = 'La edad tiene que ser numeros';
    return false;
  }

  if (mail.indexOf('@') == -1) {
    document.getElementById('mensaje').innerHTML = 'El mail tiene que tener @';
    return false;
  }

  if (clave != clave2) {
    document.getElementById('mensaje').innerHTML = 'Las claves no son iguales';
    return false;
  }

  // traigo la lista de usuarios guardados, si no hay ninguno arranco con una lista vacia
  var listaUsuarios = localStorage.getItem('logins');
  if (listaUsuarios == null) {
    listaUsuarios = [];
  } else {
    listaUsuarios = JSON.parse(listaUsuarios);
  }

  var usuarioNuevo = {
    nombre: nombre,
    apellido: apellido,
    edad: edad,
    mail: mail,
    clave: clave
  };

  listaUsuarios.push(usuarioNuevo);
  localStorage.setItem('logins', JSON.stringify(listaUsuarios));

  document.getElementById('mensaje').innerHTML = 'Cuenta creada. Ahora podes iniciar sesion';
  cambiarFormulario('login');

  return false;
}

function iniciarSesion() {
  var mail = document.getElementById('loginMail').value;
  var clave = document.getElementById('loginClave').value;

  var listaUsuarios = localStorage.getItem('logins');
  if (listaUsuarios == null) {
    document.getElementById('mensaje').innerHTML = 'Mail o clave incorrecta';
    return false;
  }

  listaUsuarios = JSON.parse(listaUsuarios);

  var encontrado = false;

  for (var i = 0; i < listaUsuarios.length; i++) {
    if (listaUsuarios[i].mail == mail && listaUsuarios[i].clave == clave) {
      encontrado = true;
      localStorage.setItem('sesionActiva', mail);
    }
  }

  if (encontrado) {
    document.getElementById('mensaje').innerHTML = 'Bienvenido';
    window.location.href = 'prueba1.html';
  } else {
    document.getElementById('mensaje').innerHTML = 'Mail o clave incorrecta';
  }

  return false;
}

</script>

</body>
</html>
